<!DOCTYPE html>
<html lang="en" data-page="resume">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resume — Sangam Tiwari</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=9">
<style>
  .resume-shell{
    position:relative;z-index:2;
    display:flex;flex-direction:column;
    height:100vh;padding-top:64px;
  }
  .resume-bar{
    display:flex;align-items:center;justify-content:space-between;
    padding:10px 28px;
    background:rgba(12,17,32,.92);
    border-bottom:1px solid var(--line);
    backdrop-filter:blur(18px);
    flex-shrink:0;
  }
  .resume-bar-left{display:flex;align-items:center;gap:14px}
  .resume-label{font-family:var(--mono,monospace);font-size:.72rem;letter-spacing:.12em;color:var(--muted,#8A94AD);text-transform:uppercase}
  .resume-name{font-family:var(--mono,monospace);font-size:.8rem;color:var(--cyan,#5EE7FF);letter-spacing:.06em}
  .resume-frame{
    flex:1;width:100%;border:none;
    background:#1a1a2e;
  }
  .resume-fallback{
    display:none;flex-direction:column;align-items:center;justify-content:center;
    height:100%;gap:18px;text-align:center;padding:40px;
  }
  .resume-fallback p{color:var(--muted,#8A94AD);font-size:.95rem;line-height:1.7}
</style>
</head>
<body>

<canvas id="neural-bg" aria-hidden="true"></canvas>
<div class="grain" aria-hidden="true"></div>
<div class="cursor-dot" aria-hidden="true"></div>
<div class="cursor-ring" aria-hidden="true"></div>
<div class="grid-overlay" aria-hidden="true"></div>

<header class="nav">
  <nav class="nav-links" aria-label="Sections">
    <a href="index.html"><span class="nav-idx">00</span>Home</a>
    <a href="work.html"><span class="nav-idx">01</span>Work</a>
    <a href="projects.html"><span class="nav-idx">02</span>Projects</a>
    <a href="contact.html"><span class="nav-idx">03</span>Contact</a>
  </nav>
  <div class="nav-right">
    <a class="btn btn-amber" href="assets/Sangam_Tiwari_Resume.pdf" download="Sangam_Tiwari_Resume.pdf" data-magnetic>Download ↓</a>
  </div>
</header>

<div class="resume-shell">
  <div class="resume-bar">
    <div class="resume-bar-left">
      <span class="resume-label">Viewing</span>
      <span class="resume-name mono">Sangam_Tiwari_Resume.pdf</span>
    </div>
    <a class="btn btn-ghost" style="padding:7px 16px;font-size:.72rem;" href="assets/Sangam_Tiwari_Resume.pdf" download="Sangam_Tiwari_Resume.pdf">Download ↓</a>
  </div>

  <iframe
    class="resume-frame"
    id="resume-frame"
    src="assets/Sangam_Tiwari_Resume.pdf"
    title="Sangam Tiwari Resume">
  </iframe>

  <div class="resume-fallback" id="resume-fallback">
    <p>Your browser can't display PDFs inline.<br>Click below to download instead.</p>
    <a class="btn btn-amber" href="assets/Sangam_Tiwari_Resume.pdf" download="Sangam_Tiwari_Resume.pdf" data-magnetic>Download Resume ↓</a>
    <a class="btn btn-ghost" href="index.html" data-magnetic>← Back to portfolio</a>
  </div>
</div>

<script src="js/main.js?v=9"></script>
<script>
  /* if iframe fails to load PDF, show fallback */
  const frame = document.getElementById('resume-frame');
  const fallback = document.getElementById('resume-fallback');
  frame.addEventListener('error', () => {
    frame.style.display = 'none';
    fallback.style.display = 'flex';
  });
</script>
</body>
</html>
