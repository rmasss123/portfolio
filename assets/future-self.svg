<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#100820" stop-opacity="1"/>
      <stop offset="100%" stop-color="#080c19" stop-opacity="1"/>
    </linearGradient>
    <radialGradient id="glow1" cx="25%" cy="58%" r="22%">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#4ade80" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="58%" r="22%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow3" cx="75%" cy="58%" r="22%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- bg -->
  <rect width="640" height="360" fill="url(#sky)"/>

  <!-- subtle grid -->
  <g stroke="#1a1530" stroke-width="0.5" opacity="0.7">
    <line x1="0" y1="60"  x2="640" y2="60"/>
    <line x1="0" y1="120" x2="640" y2="120"/>
    <line x1="0" y1="180" x2="640" y2="180"/>
    <line x1="0" y1="240" x2="640" y2="240"/>
    <line x1="0" y1="300" x2="640" y2="300"/>
    <line x1="107" y1="0" x2="107" y2="360"/>
    <line x1="214" y1="0" x2="214" y2="360"/>
    <line x1="320" y1="0" x2="320" y2="360"/>
    <line x1="427" y1="0" x2="427" y2="360"/>
    <line x1="534" y1="0" x2="534" y2="360"/>
  </g>

  <!-- glow pools -->
  <rect width="640" height="360" fill="url(#glow1)"/>
  <rect width="640" height="360" fill="url(#glow2)"/>
  <rect width="640" height="360" fill="url(#glow3)"/>

  <!-- timeline spine -->
  <line x1="80" y1="210" x2="560" y2="210" stroke="white" stroke-width="1" opacity="0.1"/>

  <!-- age +5 node (green) -->
  <circle cx="160" cy="210" r="5" fill="#4ade80" opacity="0.85"/>
  <line x1="160" y1="205" x2="160" y2="155" stroke="#4ade80" stroke-width="1" opacity="0.4" stroke-dasharray="3 3"/>
  <rect x="112" y="132" width="96" height="22" rx="3" fill="#4ade80" fill-opacity="0.08" stroke="#4ade80" stroke-width="0.5" stroke-opacity="0.3"/>
  <text x="160" y="147" text-anchor="middle" font-family="monospace" font-size="9" fill="#4ade80" opacity="0.8" letter-spacing="1">YOU + 5 YRS</text>

  <!-- age +20 node (amber) -->
  <circle cx="320" cy="210" r="5" fill="#fbbf24" opacity="0.85"/>
  <line x1="320" y1="205" x2="320" y2="115" stroke="#fbbf24" stroke-width="1" opacity="0.4" stroke-dasharray="3 3"/>
  <rect x="272" y="92" width="96" height="22" rx="3" fill="#fbbf24" fill-opacity="0.08" stroke="#fbbf24" stroke-width="0.5" stroke-opacity="0.3"/>
  <text x="320" y="107" text-anchor="middle" font-family="monospace" font-size="9" fill="#fbbf24" opacity="0.8" letter-spacing="1">YOU + 20 YRS</text>

  <!-- age 80 node (purple) -->
  <circle cx="480" cy="210" r="5" fill="#a78bfa" opacity="0.85"/>
  <line x1="480" y1="205" x2="480" y2="155" stroke="#a78bfa" stroke-width="1" opacity="0.4" stroke-dasharray="3 3"/>
  <rect x="432" y="132" width="96" height="22" rx="3" fill="#a78bfa" fill-opacity="0.08" stroke="#a78bfa" stroke-width="0.5" stroke-opacity="0.3"/>
  <text x="480" y="147" text-anchor="middle" font-family="monospace" font-size="9" fill="#a78bfa" opacity="0.8" letter-spacing="1">YOU AT 80</text>

  <!-- node labels below line -->
  <text x="160" y="232" text-anchor="middle" font-family="monospace" font-size="8" fill="white" opacity="0.2">🌱</text>
  <text x="320" y="232" text-anchor="middle" font-family="monospace" font-size="8" fill="white" opacity="0.2">🌳</text>
  <text x="480" y="232" text-anchor="middle" font-family="monospace" font-size="8" fill="white" opacity="0.2">🕯️</text>

  <!-- dots on spine -->
  <circle cx="80"  cy="210" r="2" fill="white" opacity="0.1"/>
  <circle cx="560" cy="210" r="2" fill="white" opacity="0.1"/>

  <!-- top labels -->
  <text x="32" y="38" font-family="monospace" font-size="10" fill="#a78bfa" opacity="0.5" letter-spacing="2">FUTURE SELF</text>
  <text x="608" y="38" text-anchor="end" font-family="monospace" font-size="10" fill="white" opacity="0.25" letter-spacing="2">MULTI-TURN CHAT</text>

  <!-- bottom note -->
  <text x="320" y="290" text-anchor="middle" font-family="monospace" font-size="9" fill="white" opacity="0.15" letter-spacing="1">YOUR DILEMMA · THREE RESPONSES · ONE TRUTH</text>
</svg>
