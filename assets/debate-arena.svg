<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="gl" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5EE7FF" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#0a0e1a" stop-opacity="0"/>
      <stop offset="100%" stop-color="#FFB454" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="bar-l" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5EE7FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#5EE7FF" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="bar-r" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FFB454" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFB454" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- bg -->
  <rect width="640" height="360" fill="#080c19"/>

  <!-- subtle grid -->
  <g stroke="#1a2040" stroke-width="0.5" opacity="0.6">
    <line x1="0" y1="60"  x2="640" y2="60"/>
    <line x1="0" y1="120" x2="640" y2="120"/>
    <line x1="0" y1="180" x2="640" y2="180"/>
    <line x1="0" y1="240" x2="640" y2="240"/>
    <line x1="0" y1="300" x2="640" y2="300"/>
    <line x1="80"  y1="0" x2="80"  y2="360"/>
    <line x1="160" y1="0" x2="160" y2="360"/>
    <line x1="240" y1="0" x2="240" y2="360"/>
    <line x1="320" y1="0" x2="320" y2="360"/>
    <line x1="400" y1="0" x2="400" y2="360"/>
    <line x1="480" y1="0" x2="480" y2="360"/>
    <line x1="560" y1="0" x2="560" y2="360"/>
  </g>

  <!-- colour wash -->
  <rect width="640" height="360" fill="url(#gl)"/>

  <!-- left waveform bars (cyan) -->
  <g fill="url(#bar-l)">
    <rect x="32"  y="148" width="18" height="64" rx="2"/>
    <rect x="58"  y="118" width="18" height="124" rx="2"/>
    <rect x="84"  y="136" width="18" height="88" rx="2"/>
    <rect x="110" y="106" width="18" height="148" rx="2"/>
    <rect x="136" y="128" width="18" height="104" rx="2"/>
    <rect x="162" y="152" width="18" height="56" rx="2"/>
    <rect x="188" y="140" width="18" height="80" rx="2"/>
    <rect x="214" y="160" width="18" height="40" rx="2"/>
    <rect x="240" y="146" width="18" height="68" rx="2"/>
    <rect x="266" y="168" width="18" height="24" rx="2"/>
  </g>

  <!-- right waveform bars (amber) -->
  <g fill="url(#bar-r)">
    <rect x="608" y="148" width="18" height="64" rx="2" transform="translate(-18,0)"/>
    <rect x="582" y="118" width="18" height="124" rx="2" transform="translate(-18,0)"/>
    <rect x="556" y="136" width="18" height="88" rx="2" transform="translate(-18,0)"/>
    <rect x="530" y="106" width="18" height="148" rx="2" transform="translate(-18,0)"/>
    <rect x="504" y="128" width="18" height="104" rx="2" transform="translate(-18,0)"/>
    <rect x="478" y="152" width="18" height="56" rx="2" transform="translate(-18,0)"/>
    <rect x="452" y="140" width="18" height="80" rx="2" transform="translate(-18,0)"/>
    <rect x="426" y="160" width="18" height="40" rx="2" transform="translate(-18,0)"/>
    <rect x="400" y="146" width="18" height="68" rx="2" transform="translate(-18,0)"/>
    <rect x="374" y="168" width="18" height="24" rx="2" transform="translate(-18,0)"/>
  </g>

  <!-- centre divider -->
  <rect x="317" y="80" width="1" height="200" fill="white" opacity="0.12"/>
  <text x="320" y="191" text-anchor="middle" font-family="monospace" font-size="11"
        fill="white" opacity="0.3" letter-spacing="4">VS</text>

  <!-- top label -->
  <text x="32" y="38" font-family="monospace" font-size="10" fill="#5EE7FF" opacity="0.5" letter-spacing="2">AI DEBATE ARENA</text>
  <text x="608" y="38" text-anchor="end" font-family="monospace" font-size="10" fill="#FFB454" opacity="0.5" letter-spacing="2">LIVE · MULTI-AGENT</text>
</svg>
